# ~/.config/foot/foot.ini

[main]
include=~/.config/foot/theme.ini
term=foot
font=Maple Mono:size=14
font-bold=Maple Mono:style=Bold:size=14
font-italic=Maple Mono:style=Italic:size=14
font-bold-italic=Maple Mono:style=Bold Italic:size=14
pad=10x10 center
resize-delay-ms=100

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes
