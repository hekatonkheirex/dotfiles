# Static ghost Starship prompt — light
# Generated by ~/.config/quickshell/scripts/ensure-style-terminal-assets.sh
# Palette roles mirror config/Colors.qml and the matching fixed Kitty theme.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #10201f"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git:"
style = "#875400"
format = "[$symbol$branch]($style) "

[git_status]
style = "#875400"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2_000
style = "#4f6260"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #287a3a)"
error_symbol = "[❯](bold #b3261e)"
vimcmd_symbol = "[❮](bold #006d67)"
