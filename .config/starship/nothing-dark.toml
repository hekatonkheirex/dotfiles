# Static nothing Starship prompt — dark
# Generated by ~/.config/quickshell/scripts/ensure-style-terminal-assets.sh
# Palette roles mirror config/Colors.qml and the matching fixed Kitty theme.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #f2f2f0"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git:"
style = "#b8b8b5"
format = "[$symbol$branch]($style) "

[git_status]
style = "#b8b8b5"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2_000
style = "#b8b8b5"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #9bd88d)"
error_symbol = "[❯](bold #d71920)"
vimcmd_symbol = "[❮](bold #d71920)"
