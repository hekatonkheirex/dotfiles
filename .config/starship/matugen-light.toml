# Material 3 Expressive Starship prompt — generated from the active Matugen palette
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$line_break\
$python\
$lua\
$c\
$rust\
$perl\
$php\
$ruby\
$character"""

[fill]
symbol = ' '

[directory]
read_only = " 󰌾"
style = "#231917"

[character]
success_symbol = "[❯](#006a64)"
error_symbol = "[❯](#ba1a1a)"
vimcmd_symbol = "[❮](#845143)"

[git_branch]
format = "[$branch]($style)"
style = "#845143"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#231917"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#9f4125"

[cmd_duration]
format = " [$duration]($style) "
style = "#9f4125"

[time]
disabled = false
time_format = "%T"
format = '$time'

[c]
symbol = '󰙱 '
style = "#9f4125"

[lua]
symbol = "󰢱 "
style = "#9f4125"

[nodejs]
symbol = "⬢ "
style = "#9f4125"

[perl]
symbol = " "
style = "#9f4125"

[php]
symbol = " "
style = "#9f4125"

[python]
symbol = " "
style = "#9f4125"

[ruby]
symbol = " "
style = "#9f4125"

[rust]
symbol = " "
style = "#9f4125"
