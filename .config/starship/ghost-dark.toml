# Static ghost Starship prompt — dark
# Generated by ~/.config/quickshell/scripts/ensure-style-terminal-assets.sh
# Palette roles mirror config/Colors.qml and the matching fixed Kitty theme.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold #cdeeea"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git:"
style = "#e0a94a"
format = "[$symbol$branch]($style) "

[git_status]
style = "#e0a94a"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2_000
style = "#5f7f7a"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold #8fe38a)"
error_symbol = "[❯](bold #e0625a)"
vimcmd_symbol = "[❮](bold #57d9cc)"
