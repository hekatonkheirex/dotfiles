# Neo Brutalism Starship prompt — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; the surrounding
# desktop theme supplies Neo Brutalism's geometry and typography.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$line_break\
$python\
$lua\
$c\
$rust\
$perl\
$php\
$ruby\
$character"""

[fill]
symbol = ' '

[directory]
read_only = " 󰌾"
style = "#e0e3e8"

[character]
success_symbol = "[❯](#ffb868)"
error_symbol = "[❯](#ffb4ab)"
vimcmd_symbol = "[❮](#adcae5)"

[git_branch]
format = "[$branch]($style)"
style = "#adcae5"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#e0e3e8"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#8fcdff"

[cmd_duration]
format = " [$duration]($style) "
style = "#8fcdff"

[time]
disabled = false
time_format = "%T"
format = '$time'

[c]
symbol = '󰙱 '
style = "#8fcdff"

[lua]
symbol = "󰢱 "
style = "#8fcdff"

[nodejs]
symbol = "⬢ "
style = "#8fcdff"

[perl]
symbol = " "
style = "#8fcdff"

[php]
symbol = " "
style = "#8fcdff"

[python]
symbol = " "
style = "#8fcdff"

[ruby]
symbol = " "
style = "#8fcdff"

[rust]
symbol = " "
style = "#8fcdff"
