# Neo Brutalism Starship prompt — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; the surrounding
# desktop theme supplies Neo Brutalism's geometry and typography.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$line_break\
$python\
$lua\
$c\
$rust\
$perl\
$php\
$ruby\
$character"""

[fill]
symbol = ' '

[directory]
read_only = " 󰌾"
style = "#f2ded9"

[character]
success_symbol = "[❯](#5dd9cf)"
error_symbol = "[❯](#ffb4ab)"
vimcmd_symbol = "[❮](#f9b7a5)"

[git_branch]
format = "[$branch]($style)"
style = "#f9b7a5"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#f2ded9"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#ffb5a0"

[cmd_duration]
format = " [$duration]($style) "
style = "#ffb5a0"

[time]
disabled = false
time_format = "%T"
format = '$time'

[c]
symbol = '󰙱 '
style = "#ffb5a0"

[lua]
symbol = "󰢱 "
style = "#ffb5a0"

[nodejs]
symbol = "⬢ "
style = "#ffb5a0"

[perl]
symbol = " "
style = "#ffb5a0"

[php]
symbol = " "
style = "#ffb5a0"

[python]
symbol = " "
style = "#ffb5a0"

[ruby]
symbol = " "
style = "#ffb5a0"

[rust]
symbol = " "
style = "#ffb5a0"
