$term = kitty
$browser = brave
$filemanager = thunar

bind = SUPER, W, killactive,
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, F, fullscreen, 0
bind = SUPER, N, layoutmsg, cyclenext
bind = SUPER, M, layoutmsg, swapwithmaster master
bind = ALT, Tab, focuscurrentorlast,
bind = SUPER SHIFT, right, exec, hyprctl dispatcher splitratio 0.1
bind = SUPER SHIFT, left, exec, hyprctl dispatcher splitratio -0.1

bind = SUPER, RETURN, exec, $term
bind = SUPER, B, exec, $browser
bind = SUPER, T, exec, $filemanager
bind = SUPER, D, exec, killall rofi || rofi -show drun
bind = CTRL, mouse:273, exec, killall rofi || rofi -show drun
bind = SUPER, escape, exec, killall wlogout || wlogout --protocol layer-shell -b 5 -T 400 -B 400
bind = SUPER, O, exec, makoctl restore
bind = SUPER SHIFT, O, exec, makoctl mode -t dnd
bind = CTRL ALT, L, exec, hyprlock
bind = SUPER, C, exec, killall -SIGUSR1 waybar
bind = SUPER SHIFT, C, exec, /home/mura/.config/waybar/launch.sh
bind = SUPER, G, exec, /home/mura/.config/hypr/scripts/gamemode.sh
bind = SUPER ALT, T, exec, /home/mura/.config/hypr/scripts/theme-switcher.sh
bind = SUPER, X, exec, /home/mura/.config/hypr/scripts/colorpicker

# bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
# bind = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
# bind = ,XF86AudioMute, exec, pactl set-sink-mute 0 toggle;
# bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume 0 -10%;
# bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume 0 +10%;

bind = ,XF86MonBrightnessDown, exec, swayosd-client --brightness -10
bind = ,XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bind = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume -10
bind = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume +10

bind = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bind = ,Print, exec, /home/mura/.config/hypr/scripts/screenshot_mngr.sh
bind = CTRL Shift, Print, exec, grim -g "$(slurp)" - | wl-copy

bind=SUPER,left,movefocus,l
bind=SUPER,right,movefocus,r
bind=SUPER,up,movefocus,u
bind=SUPER,down,movefocus,d

bind=SUPER,H,movefocus,l
bind=SUPER,L,movefocus,r
bind=SUPER,K,movefocus,u
bind=SUPER,J,movefocus,d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER ALT, up, workspace, e+1
bind = SUPER ALT, down, workspace, e-1

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bind = SUPER, S, movetoworkspace, special
bind = SUPER SHIFT, S, togglespecialworkspace

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindl = , switch:on:Lid Switch, exec, hyprlock && systemctl suspend
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# Hyprexpo
bind = SUPER, Y, hyprexpo:expo, toggle

# Hyprscrolling
bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma, layoutmsg, move -col
bind = SUPER SHIFT, period, layoutmsg, movewindowto r
bind = SUPER SHIFT, comma, layoutmsg, movewindowto l
bind = SUPER SHIFT, up, layoutmsg, movewindowto u
bind = SUPER SHIFT, down, layoutmsg, movewindowto d
