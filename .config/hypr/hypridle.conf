general {
    lock_cmd = pidoff hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 150
    on-timeout = sh -c 'if grep -q "Discharging" /sys/class/power_supply/BAT*/status; then brightnessctl set 30%; else brightnessctl set 100%; fi'
    on-resume = brightnessctl set 100%
}

listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 360
    on-timeout = systemctl suspend
}
