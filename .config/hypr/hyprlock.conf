# Hyprlock

general {
    hide_cursor = true
    disable_loading_bar = false
    grace = 5
    no_fade_in = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

background {
    monitor =
    path = /home/mura/Pictures/Walls/tahoe-dark.jpg
    color = rgba(30, 30, 46, 0.9)

    # Blur
    blur_passes = 3 # 0 disables blurring
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(13, 17, 23, 0.6)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff66">Enter Password</span> # Text rendered in the input box when it's empty.
    hide_input = false

    position = 0, -140
    halign = center
    valign = center
}

# User Profile Image (Optional - Use your own photo)
image {
    monitor =
    path = ~/.face # Ensure you have a square profile picture here
    size = 100
    rounding = -1 # Makes it a perfect circle
    border_size = 2
    border_color = rgba(255, 255, 255, 0.2)
    position = 0, -50
    halign = center
    valign = center
}

# Labels
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 96
    font_family = SF Pro Display Light

    position = 0, 320
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.7)
    font_family = SF Pro Display
    font_size = 20

    position = 0, 220
    halign = center
    valign = center
}
