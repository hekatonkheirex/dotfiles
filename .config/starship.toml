format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$line_break\
$python\
$lua\
$c\
$rust\
$perl\
$php\
$ruby\
$character"""

[fill]
symbol = ' '

[directory]
read_only = " 󰌾"
style = "#d0bcff"

[character]
success_symbol = "[❯](#d0bcff)"
error_symbol = "[❯](#f2b8b5)"
vimcmd_symbol = "[❮](#efb8c8)"

[git_branch]
format = "[$branch]($style)"
style = "#e6e1e5"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#efb8c8"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#938f99"

[cmd_duration]
format = " [$duration]($style) "
style = "#efb8c8"

[time]
disabled = false
time_format = "%T"
format = '$time'

[c]
symbol = '󰙱 '

[lua]
symbol = "󰢱 "

[nodejs]
symbol = "⬢ "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

