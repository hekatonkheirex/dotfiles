format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$line_break\
$python\
$lua\
$c\
$rust\
$perl\
$php\
$ruby\
$character"""

[fill]
symbol = ' '

[directory]
read_only = " 󰌾"
style = "#0088ff"

[character]
success_symbol = "[❯](#79b757)"
error_symbol = "[❯](#ed5f5d)"
vimcmd_symbol = "[❮](#ff6489)"

[git_branch]
format = "[$branch]($style)"
style = "#8b949e"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#048abf"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#8b949e"

[cmd_duration]
format = " [$duration]($style) "
style = "#e9873a"

[time]
disabled = false
time_format = "%T"
format = '$time'

[c]
symbol = '󰙱 '

[lua]
symbol = "󰢱 "

[nodejs]
symbol = "⬢ "

[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

