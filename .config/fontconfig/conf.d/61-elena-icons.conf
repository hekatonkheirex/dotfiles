<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Four files in ~/.local/share/fonts/icomoon share the family "icomoon", so
       an app cannot select remix.ttf by family name. Give remix.ttf its own
       family for the elena bottom bar and dock (BottomBarFonts.family). -->
  <match target="scan">
    <test name="file" compare="contains"><string>/.local/share/fonts/icomoon/remix.ttf</string></test>
    <edit name="family" mode="assign" binding="same"><string>ElenaIcons</string></edit>
  </match>
</fontconfig>
