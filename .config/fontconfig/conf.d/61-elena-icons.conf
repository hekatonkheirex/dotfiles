<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Four files in ~/.local/share/fonts/icomoon share the family "icomoon", and
       several codepoints exist in more than one of them. Pango falls back per
       glyph in this priority: icomoon-feather.ttf (a byte-duplicate of
       icomoon_Regular.ttf, which stays "icomoon"), then remix.ttf, then
       iconic.ttf. A single family name cannot select one file, so each file
       gets its own family and the elena bottom bar and dock list them in that
       same order (BottomBarFonts.families). Qt 6.12 has no Text font.families,
       so the pattern rule below makes fontconfig append ElenaIcons2 and 3 to
       any request for ElenaIcons1; Qt then falls back per glyph through that
       list. -->
  <match target="scan">
    <test name="file" compare="contains"><string>/.local/share/fonts/icomoon/icomoon-feather.ttf</string></test>
    <edit name="family" mode="assign" binding="same"><string>ElenaIcons1</string></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>/.local/share/fonts/icomoon/remix.ttf</string></test>
    <edit name="family" mode="assign" binding="same"><string>ElenaIcons2</string></edit>
  </match>
  <match target="scan">
    <test name="file" compare="contains"><string>/.local/share/fonts/icomoon/iconic.ttf</string></test>
    <edit name="family" mode="assign" binding="same"><string>ElenaIcons3</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ElenaIcons1</string></test>
    <edit name="family" mode="append"><string>ElenaIcons2</string></edit>
    <edit name="family" mode="append"><string>ElenaIcons3</string></edit>
  </match>
</fontconfig>
