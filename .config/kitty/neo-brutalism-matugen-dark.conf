# Neo Brutalism Kitty theme — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #e0e3e8
background            #101417
selection_foreground  #003450
selection_background  #8fcdff

cursor                #8fcdff
cursor_text_color     #003450

url_color             #8fcdff

active_tab_foreground   #003450
active_tab_background   #8fcdff
inactive_tab_foreground #bfc7d1
inactive_tab_background #272a2e

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #1c2024
color1  #ffb4ab
color2  #ffb868
color3  #8fcdff
color4  #adcae5
color5  #c88123
color6  #2f4c62
color7  #bfc7d1

# ANSI — Bright (8-15)
color8  #89929b
color9  #ffb4ab
color10 #ffb868
color11 #3e98d3
color12 #adcae5
color13 #c88123
color14 #2f4c62
color15 #e0e3e8
