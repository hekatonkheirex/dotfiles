# Neo Brutalism Kitty theme — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #f2ded9
background            #1a110f
selection_foreground  #5f1500
selection_background  #ffb5a0

cursor                #ffb5a0
cursor_text_color     #5f1500

url_color             #ffb5a0

active_tab_foreground   #5f1500
active_tab_background   #ffb5a0
inactive_tab_foreground #ddc0b9
inactive_tab_background #322725

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #271d1a
color1  #ffb4ab
color2  #5dd9cf
color3  #ffb5a0
color4  #f9b7a5
color5  #00a49b
color6  #6b3d2f
color7  #ddc0b9

# ANSI — Bright (8-15)
color8  #a48b84
color9  #ffb4ab
color10 #5dd9cf
color11 #e17353
color12 #f9b7a5
color13 #00a49b
color14 #6b3d2f
color15 #f2ded9
