# Neo Brutalism Kitty theme — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #e5e1eb
background            #13121a
selection_foreground  #2a0f95
selection_background  #c6bfff

cursor                #c6bfff
cursor_text_color     #2a0f95

url_color             #c6bfff

active_tab_foreground   #2a0f95
active_tab_background   #c6bfff
inactive_tab_foreground #c8c4d5
inactive_tab_background #2a2931

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #201f26
color1  #ffb4ab
color2  #ffb596
color3  #c6bfff
color4  #c7c0f6
color5  #6f2800
color6  #484471
color7  #c8c4d5

# ANSI — Bright (8-15)
color8  #928f9f
color9  #ffb4ab
color10 #ffb596
color11 #3926a2
color12 #c7c0f6
color13 #6f2800
color14 #484471
color15 #e5e1eb
