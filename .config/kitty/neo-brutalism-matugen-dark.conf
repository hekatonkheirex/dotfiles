# Neo Brutalism Kitty theme — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #e9e0e1
background            #161213
selection_foreground  #462733
selection_background  #e9bac9

cursor                #e9bac9
cursor_text_color     #462733

url_color             #e9bac9

active_tab_foreground   #462733
active_tab_background   #e9bac9
inactive_tab_foreground #d3c2c6
inactive_tab_background #2d292a

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #221f20
color1  #ffb4ab
color2  #b6cdad
color3  #e9bac9
color4  #d8c0c7
color5  #819779
color6  #534248
color7  #d3c2c6

# ANSI — Bright (8-15)
color8  #9b8d91
color9  #ffb4ab
color10 #b6cdad
color11 #af8593
color12 #d8c0c7
color13 #819779
color14 #534248
color15 #e9e0e1
