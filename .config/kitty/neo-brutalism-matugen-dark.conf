# Neo Brutalism Kitty theme — Matugen dark
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# This initial copy reflects the current Matugen cache; synchronization keeps
# it aligned with the active wallpaper.

foreground            #f9dcd9
background            #1e100e
selection_foreground  #680008
selection_background  #ffb3ac

cursor                #ffb3ac
cursor_text_color     #680008

url_color             #ffb3ac

active_tab_foreground   #680008
active_tab_background   #ffb3ac
inactive_tab_foreground #e3beba
inactive_tab_background #362624

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
color0  #2b1c1a
color1  #ffb4ab
color2  #79d2f1
color3  #ffb3ac
color4  #ffb3ac
color5  #007d99
color6  #7e2a26
color7  #e3beba

# ANSI — Bright (8-15)
color8  #aa8986
color9  #ffb4ab
color10 #79d2f1
color11 #d43634
color12 #ffb3ac
color13 #007d99
color14 #7e2a26
color15 #f9dcd9
