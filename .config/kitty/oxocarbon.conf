# The basic colors
foreground              #ffffff
background              #161616
selection_foreground    #262626
selection_background    #f4f4f4

# Cursor colors
cursor                  #e0e0e0
cursor_text_color       #161616

# URL underline color when hovering with mouse
url_color               #8a3ffc

# Kitty window border colors
active_border_color     #fa4d56
inactive_border_color   #525252
bell_border_color       #6fdc8c

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #161616
active_tab_background   #8a3ffc
inactive_tab_foreground #e0e0e0
inactive_tab_background #393939
tab_bar_background      #161616

# Colors for marks (marked text in the terminal)
mark1_foreground #161616
mark1_background #8a3ffc
mark2_foreground #161616
mark2_background #8a3ffc
mark3_foreground #161616
mark3_background #33b1ff

