# Claude.ai Optimized Light Theme — FINAL (2026-07-01)
# Source: claude-colorscheme-final.txt (M3 tokens + WCAG-corrected ANSI)

# Base Colors
foreground            #121212  # onSurface (10.9:1 on bg)
background            #EFEEEB  # bg

# Interactive Elements
selection_foreground  #121212  # onSurface
selection_background  #E3E3E2  # surfaceContainerHigh

# Cursor Colors
cursor                #9C553E  # primary, darkened for on-bg contrast
cursor_text_color     #EFEEEB  # bg

# URL Underline
url_color             #D97757  # primary

# Tab bar colors
active_tab_foreground   #121212  # onSurface
active_tab_background   #D97757  # primary
inactive_tab_foreground #9B8178  # secondary
inactive_tab_background #E1E0DB  # surfaceDim

background_opacity         1.0
dynamic_background_opacity yes

# Claude ANSI — Normal (0-7)
# WCAG 4.5:1-checked against #EFEEEB background
color0  #E1E0DB        # surfaceDim (black)
color1  #8D2E45        # error (red)
color2  #42734C        # green, darkened (green)
color3  #9C553E        # primary, darkened (yellow)
color4  #256BBF        # tertiary, darkened (blue)
color5  #78645D        # secondary, darkened (magenta)
color6  #367288        # tertiary rotated + darkened (cyan)
color7  #615D52        # onSurfaceVariant (white)

# Claude ANSI — Bright (8-15)
color8  #898781        # outline (bright black)
color9  #B23A56        # error, lightened (bright red)
color10 #487250        # bright green
color11 #935E47        # primary, darkened variant (bright yellow)
color12 #436CA5        # tertiary, darkened variant (bright blue)
color13 #76655F        # secondary, darkened variant (bright magenta)
color14 #427080        # bright cyan
color15 #121212        # onSurface (bright white)
