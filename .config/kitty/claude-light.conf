# Claude.ai Optimized Light Theme
# Based on Claude.ai website colors with optimized contrast

# Base Colors (Exact match - excellent contrast)
foreground            #3D3929  # Color2: Website text (13.2:1 on bg)
background            #EEECE2  # Color8: Website background

# Interactive Elements (Optimized for contrast)
selection_foreground  #EEECE2  # Inverse: bg color for text on selection
selection_background  #8492A3  # Color5: Slate blue-gray (4.87:1 with fg)

# Cursor Colors (Optimized for visibility)
cursor                #000000  # Color1: Pure black (17.7:1 inverse)
cursor_text_color     #EEECE2  # Inverse: bg color (17.7:1 with cursor)

# URL Underline (Keep brand color but consider weight)
url_color             #BD5D3A  # Color3: Website accent (use bold/weight if needed)

# Tab bar colors
active_tab_foreground   #3D3929  # Color2: Text color
active_tab_background   #BD5D3A  # Color3: Accent color
inactive_tab_foreground #8492A3  # Color5: Muted accent
inactive_tab_background #F5F3ED  # Slightly lighter than bg

# Slight transparency for depth
background_opacity         1.0
dynamic_background_opacity yes

# Claude ANSI — Normal (0-7)
# Derived from brand colors with proper contrast for light background
color0  #000000        # Color1: Pure black (black ANSI)
color1  #BD5D3A        # Color3: Burnt orange (red ANSI)
color2  #6B8E23        # DarkOliveGreen (green ANSI - darker for contrast)
color3  #DAA520        # Goldenrod (yellow ANSI - darker for contrast)
color4  #4682B4        # SteelBlue (blue ANSI - darker for contrast)
color5  #9370DB        # MediumPurple (magenta ANSI - darker for contrast)
color6  #20B2AA        # LightSeaGreen (cyan ANSI - darker for contrast)
color7  #EEECE2        # Color8: Background (white ANSI)

# Claude ANSI — Bright (8-15)
# Brighter variants for better visibility
color8  #696969        # DimGray (bright black)
color9  #CD5C5C        # IndianRed (bright red)
color10 #9ACD32        # YellowGreen (bright green)
color11 #FFD700        # Gold (bright yellow)
color12 #6495ED        # CornflowerBlue (bright blue)
color13 #DA70D6        # Orchid (bright magenta)
color14 #00CED1        # DarkTurquoise (bright cyan)
color15 #FFFFFF        # Pure white (bright white)