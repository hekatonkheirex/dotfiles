# Neo Brutalism Kitty theme — Matugen light
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #1e1b1c
background            #fff8f8
selection_foreground  #ffffff
selection_background  #916a77

cursor                #76525f
cursor_text_color     #ffffff

url_color             #76525f

active_tab_foreground   #ffffff
active_tab_background   #916a77
inactive_tab_foreground #4f4447
inactive_tab_background #efe6e7

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #f5eced
color1  #ba1a1a
color2  #4d6147
color3  #76525f
color4  #6c595f
color5  #657a5e
color6  #f3d9e0
color7  #4f4447

# ANSI — Bright (8-15)
color8  #817477
color9  #ba1a1a
color10 #4d6147
color11 #916a77
color12 #6c595f
color13 #657a5e
color14 #f3d9e0
color15 #1e1b1c
