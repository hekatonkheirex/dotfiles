# Neo Brutalism Kitty theme — Matugen light
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #231917
background            #fff8f6
selection_foreground  #000000
selection_background  #e17353

cursor                #9f4125
cursor_text_color     #ffffff

url_color             #9f4125

active_tab_foreground   #000000
active_tab_background   #e17353
inactive_tab_foreground #56423d
inactive_tab_background #f8e4df

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #fdeae5
color1  #ba1a1a
color2  #006a64
color3  #9f4125
color4  #845143
color5  #00a49b
color6  #ffbcaa
color7  #56423d

# ANSI — Bright (8-15)
color8  #89726c
color9  #ba1a1a
color10 #006a64
color11 #e17353
color12 #845143
color13 #00a49b
color14 #ffbcaa
color15 #231917
