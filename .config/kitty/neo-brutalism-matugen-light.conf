# Neo Brutalism Kitty theme — Matugen light
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #1c1b22
background            #fcf8ff
selection_foreground  #d3cdff
selection_background  #3926a2

cursor                #22008a
cursor_text_color     #ffffff

url_color             #22008a

active_tab_foreground   #d3cdff
active_tab_background   #3926a2
inactive_tab_foreground #474553
inactive_tab_background #ebe6f1

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #f1ecf7
color1  #ba1a1a
color2  #4b1900
color3  #22008a
color4  #5e5988
color5  #6f2800
color6  #cfc9ff
color7  #474553

# ANSI — Bright (8-15)
color8  #787584
color9  #ba1a1a
color10 #4b1900
color11 #3926a2
color12 #5e5988
color13 #6f2800
color14 #cfc9ff
color15 #1c1b22
