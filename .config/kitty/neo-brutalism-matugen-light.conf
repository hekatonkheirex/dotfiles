# Neo Brutalism Kitty theme — Matugen light
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# Colors are the current wallpaper-derived Material 3 roles; Neo Brutalism's
# visual treatment is supplied by the surrounding desktop theme.

foreground            #181c20
background            #f7f9ff
selection_foreground  #ffffff
selection_background  #0b7bb5

cursor                #006191
cursor_text_color     #ffffff

url_color             #006191

active_tab_foreground   #ffffff
active_tab_background   #0b7bb5
inactive_tab_foreground #40484f
inactive_tab_background #e6e8ed

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
# black=surface_container red=error green=tertiary yellow=primary
# blue=secondary magenta=tertiary_container cyan=secondary_container
color0  #ebeef3
color1  #ba1a1a
color2  #855000
color3  #006191
color4  #456179
color5  #a76600
color6  #c6e3ff
color7  #40484f

# ANSI — Bright (8-15)
color8  #707881
color9  #ba1a1a
color10 #855000
color11 #0b7bb5
color12 #456179
color13 #a76600
color14 #c6e3ff
color15 #181c20
