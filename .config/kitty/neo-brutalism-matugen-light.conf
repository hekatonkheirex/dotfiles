# Neo Brutalism Kitty theme — Matugen light
# Generated by ~/.config/quickshell/scripts/generate-neo-kitty-theme.sh
# This initial copy reflects the current Matugen cache; synchronization keeps
# it aligned with the active wallpaper.

foreground            #271816
background            #fff8f7
selection_foreground  #ffffff
selection_background  #d43634

cursor                #b11a1f
cursor_text_color     #ffffff

url_color             #b11a1f

active_tab_foreground   #ffffff
active_tab_background   #d43634
inactive_tab_foreground #5b403e
inactive_tab_background #ffe2df

background_opacity         1.0
dynamic_background_opacity yes

# ANSI — Normal (0-7)
color0  #ffe9e7
color1  #ba1a1a
color2  #006279
color3  #b11a1f
color4  #9c413c
color5  #007d99
color6  #ff8e85
color7  #5b403e

# ANSI — Bright (8-15)
color8  #8f706d
color9  #ba1a1a
color10 #006279
color11 #d43634
color12 #9c413c
color13 #007d99
color14 #ff8e85
color15 #271816
