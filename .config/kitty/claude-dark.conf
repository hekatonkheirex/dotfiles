# Claude.ai Optimized Dark Theme
# Based on Claude.ai website colors adapted for dark background

# Base Colors (Inverted from light theme for dark mode)
foreground            #EEECE2  # Color8: Light background becomes text
background            #000000  # Color2: Dark text becomes background

# Interactive Elements (Optimized for contrast)
selection_foreground  #3D3929  # Color2: fg color for text on selection
selection_background  #8492A3  # Color5: Slate blue-gray (4.87:1 with bg in dark mode)

# Cursor Colors (Optimized for visibility)
cursor                #BD5D3A  # Color3: Accent color for cursor
cursor_text_color     #3D3929  # Color2: Dark bg color for cursor text

# URL Underline (Keep brand color)
url_color             #BD5D3A  # Color3: Website accent

# Tab bar colors
active_tab_foreground   #EEECE2  # Color8: Light text
active_tab_background   #BD5D3A  # Color3: Accent color
inactive_tab_foreground #8492A3  # Color5: Muted accent
inactive_tab_background #4A4537  # Slightly darker than bg

# Slight transparency for depth
background_opacity         1.0
dynamic_background_opacity yes

# Claude ANSI — Normal (0-7)
# Dark variant ANSI colors
color0  #3D3929        # Color2: Dark background (black ANSI)
color1  #FF6B6B        # Light red (red ANSI - bright for dark bg)
color2  #98C379        # Green (green ANSI)
color3  #D19A66        # Orange/brown (yellow ANSI)
color4  #61AFEF        # Blue (blue ANSI)
color5  #C678DD        # Purple (magenta ANSI)
color6  #56B6C2        # Cyan (cyan ANSI)
color7  #EEECE2        # Color8: Light text (white ANSI)

# Claude ANSI — Bright (8-15)
# Brighter variants
color8  #5C5C5C        # Darker gray (bright black)
color9  #FF8A80        # Lighter red (bright red)
color10 #A8E6CF        # Light green (bright green)
color11 #FFD580        # Light yellow (bright yellow)
color12 #82AAFF        # Light blue (bright blue)
color13 #D080FF        # Light purple (bright magenta)
color14 #80DEEA        # Light cyan (bright cyan)
color15 #FFFFFF        # Pure white (bright white)
