# Claude.ai Optimized Dark Theme — FINAL (2026-07-01)
# Source: claude-colorscheme-final.txt (M3 tokens + ANSI)

# Base Colors
foreground            #EDEDED  # onSurface
background            #121212  # bg

# Interactive Elements
selection_foreground  #EDEDED  # onSurface
selection_background  #292929  # surfaceContainerHigh

# Cursor Colors
cursor                #DF8D72  # primary
cursor_text_color     #121212  # bg

# URL Underline
url_color             #DF8D72  # primary

# Tab bar colors
active_tab_foreground   #EDEDED  # onSurface
active_tab_background   #DF8D72  # primary
inactive_tab_foreground #B5A29B  # secondary
inactive_tab_background #1F1F1F  # surfaceContainer

background_opacity         1.0
dynamic_background_opacity yes

# Claude ANSI — Normal (0-7)
color0  #1F1F1F        # surfaceContainer (black)
color1  #D47C92        # error (red)
color2  #7FB88A        # green, synthesized (green)
color3  #DF8D72        # primary (yellow)
color4  #7FADE6        # tertiary (blue)
color5  #B5A29B        # secondary (magenta)
color6  #6FBCD6        # tertiary rotated toward cyan (cyan)
color7  #BFBFBF        # onSurfaceVariant (white)

# Claude ANSI — Bright (8-15)
color8  #8F8A8A        # outline (bright black)
color9  #E098AB        # error, lightened (bright red)
color10 #97CBA1        # bright green
color11 #EBA88F        # primary, lightened (bright yellow)
color12 #99C1EC        # tertiary, lightened (bright blue)
color13 #C9BAB5        # secondary, lightened (bright magenta)
color14 #8ECEE3        # bright cyan
color15 #FFFFFF        # bright white
