# GHOST terminal palette
# Source of truth: ~/.config/quickshell/config/Colors.qml (ghost* properties)
# This is deliberately static: do not route it through Matugen or theme.conf.

foreground            #cdeeea
background            #05080a
selection_foreground  #cdeeea
selection_background  #1c262a

cursor                #57d9cc
cursor_text_color     #05080a
url_color             #57d9cc

active_tab_foreground   #05080a
active_tab_background   #57d9cc
inactive_tab_foreground #5f7f7a
inactive_tab_background #0d1418

background_opacity         1.0
dynamic_background_opacity no

# ANSI roles use the named semantic GHOST colors. Blue, magenta, and cyan
# intentionally share GHOST's single cyan accent instead of adding new hues.
color0  #0d1418
color1  #e0625a
color2  #8fe38a
color3  #e0a94a
color4  #57d9cc
color5  #57d9cc
color6  #57d9cc
color7  #cdeeea

color8  #678984
color9  #e0625a
color10 #8fe38a
color11 #e0a94a
color12 #57d9cc
color13 #57d9cc
color14 #57d9cc
color15 #cdeeea
