# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,switch_proportion_preset,next
bind=SUPER+SHIFT+ALT,r,reload_config

# menu and terminal
bind=SUPER,d,spawn,~/.config/quickshell/scripts/launcher
bind=SUPER,Return,spawn,kitty
bind=SUPER,B,spawn,brave-origin
bind=SUPER,T,spawn,nautilus
bind=SUPER,Escape,spawn,~/.config/quickshell/scripts/quickmenu
bind=SUPER,A,spawn_shell,kitty -e opencode
bindl=SUPER+ALT,L,spawn,~/.config/quickshell/scripts/lock
bindl=SUPER+ALT,S,spawn_shell,pkill orca || exec orca

# exit
bind=SUPER,m,quit
bind=SUPER,w,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT+ALT,Up,exchange_client,up
bind=SUPER+SHIFT+ALT,Down,exchange_client,down
bind=SUPER+SHIFT+ALT,Left,exchange_client,left
bind=SUPER+SHIFT+ALT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER+ALT,i,minimized,
bind=SUPER,o,toggleoverview,
bind=SUPER+SHIFT+ALT,I,restore_minimized
bind=SUPER,s,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# Niri column/workspace navigation mapped onto Mango's scroller and tags.
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT+CTRL,Left,tagmon,left,1
bind=SUPER+SHIFT+CTRL,Right,tagmon,right,1
bind=SUPER+SHIFT+CTRL,Up,tagmon,up,1
bind=SUPER+SHIFT+CTRL,Down,tagmon,down,1

bind=SUPER,Page_Up,viewtoleft_have_client,0
bind=SUPER,Page_Down,viewtoright_have_client,0
bind=SUPER,U,viewtoleft_have_client,0
bind=SUPER,I,viewtoright_have_client,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,U,tagtoleft,0
bind=SUPER+CTRL,I,tagtoright,0
bind=SUPER+SHIFT,Page_Up,viewtoleft,0
bind=SUPER+SHIFT,Page_Down,viewtoright,0
bind=SUPER+SHIFT,U,viewtoleft,0
bind=SUPER+SHIFT,I,viewtoright,0

# Niri's column sizing/centering equivalents.
# Mango keeps the reload action on Super+Shift+Alt+R so Niri's Super+R width
# preset remains available; Alt+X keeps the existing reverse preset action.
bind=SUPER+CTRL,F,set_proportion,1.0
bind=SUPER,C,centerwin,
bind=SUPER+CTRL,C,centerwin,

# Recent-window switching. Mango cannot filter the switcher by app-id, so
# these remain global recent-client switches.
bind=ALT,Tab,switcher,all_next
bind=ALT+SHIFT,Tab,switcher,all_prev

# tag switch
# bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
# bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Niri startup.kdl media, brightness, radio, and utility bindings.
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0 && ~/.config/quickshell/scripts/emit-trigger qsosd-vol
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1- && ~/.config/quickshell/scripts/emit-trigger qsosd-vol
bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ~/.config/quickshell/scripts/emit-trigger qsosd-vol
bindl=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && ~/.config/quickshell/scripts/emit-trigger qsosd-mic
bindl=NONE,XF86AudioPlay,spawn_shell,python3 ~/.config/quickshell/scripts/mpris_control.py play
bindl=NONE,XF86AudioStop,spawn_shell,python3 ~/.config/quickshell/scripts/mpris_control.py stop
bindl=NONE,XF86AudioPrev,spawn_shell,python3 ~/.config/quickshell/scripts/mpris_control.py prev
bindl=NONE,XF86AudioNext,spawn_shell,python3 ~/.config/quickshell/scripts/mpris_control.py next
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +10% && ~/.config/quickshell/scripts/emit-trigger qsosd-bright
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 10%- && ~/.config/quickshell/scripts/emit-trigger qsosd-bright
bindl=NONE,XF86WLAN,spawn,~/.config/quickshell/scripts/toggle-airplane.sh
bindl=SUPER,F8,spawn,~/.config/quickshell/scripts/toggle-airplane.sh
bindl=NONE,F8,spawn,~/.config/quickshell/scripts/toggle-airplane.sh
bindl=NONE,XF86Bluetooth,spawn,~/.config/quickshell/scripts/toggle-bluetooth.sh
bindl=SUPER,F10,spawn,~/.config/quickshell/scripts/toggle-bluetooth.sh
bindl=NONE,F10,spawn,~/.config/quickshell/scripts/toggle-bluetooth.sh
bind=NONE,XF86Display,spawn,wdisplays
bind=NONE,XF86Tools,spawn,~/.config/quickshell/scripts/commandcenter
bind=NONE,XF86Keyboard,spawn,fcitx5-configtool
bind=NONE,XF86Favorites,spawn,kitty

# Screenshots are handled by the existing grim/slurp helper. Mango has no
# native screenshot dispatcher and the helper intentionally supports screen
# and region captures only.
bind=NONE,Print,spawn_shell,~/.config/quickshell/scripts/capture-screen.sh screen
bind=CTRL,Print,spawn_shell,~/.config/quickshell/scripts/capture-screen.sh region

# The Niri power-off-monitors action maps to Mango's external output switch.
bind=SUPER+SHIFT,P,spawn_shell,wlopm --off
bind=SUPER+SHIFT,E,quit,

# Lock on the physical lid switch, matching Niri's switch-events block.
switchbind=fold,spawn,~/.config/quickshell/scripts/lock

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
