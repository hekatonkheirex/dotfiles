# Fallback first, then the exact output rule last so initial startup and
# reloads resolve to the same position. This mirrors Niri's eDP-1 at x=1280.
monitorrule=make:Chimei Innolux Corporation,model:0x15F5,width:1920,height:1080,refresh:60.02,x:1280,y:0
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60.02,x:1280,y:0

# External display from Niri's outputs.kdl.
monitorrule=name:^HDMI-A-2$,width:1920,height:1080,refresh:60,x:0,y:0

# Virtual monitor with pattern matching
monitorrule=name:HEADLESS-.*,width:1920,height:1080,refresh:60,x:1926,y:0,scale:1,rr:0,vrr:0
