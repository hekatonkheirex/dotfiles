# Window Rules

# Assignes tags to apps
windowrule=tags:1,appid:^brave-origin$
windowrule=tags:2,appid:^kitty$
windowrule=tags:3,appid:^org.gnome.Nautilus$

# Floating rules
windowrule=isfloating:1,appid:^brave-origin$,title:^Picture-in-Picture$
windowrule=isfloating:1,appid:^firefox$,title:^Picture-in-Picture$
windowrule=isfloating:1,appid:^(galculator|blueman-manager|nm-connection-editor|xdg-desktop-portal.*)$
windowrule=force_tiled_state:1,appid:^pavucontrol$
windowrule=scroller_proportion:0.5,appid:^pavucontrol$

# Keep Mango's global 2px border for these clients. Niri's
# draw-border-with-background=false is not equivalent to Mango's isnoborder.
windowrule=focused_opacity:0.9,unfocused_opacity:0.9,appid:^(org\.wezfurlong\.wezterm$|zen$|kitty$|org\.gnome\.Nautilus$)

# Layer Rules
# Keep notification and shell layers crisp when effects are enabled later.
layerrule=noblur:1,layer_name:^notifications$
layerrule=noblur:1,layer_name:^quickshell-.*$
