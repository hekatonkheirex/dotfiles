source = ~/.config/mango/decorations.conf
source = ~/.config/mango/animations.conf
source = ~/.config/mango/layouts.conf
source = ~/.config/mango/inputs.conf
source = ~/.config/mango/keybinds.conf
source = ~/.config/mango/windowrules.conf
source = ~/.config/mango/env.conf

exec-once = ~/.config/mango/autostart.sh

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=MacTahoe-dark
drag_tile_to_tile=1
